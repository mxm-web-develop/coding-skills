name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go test ./...
          go vet ./...
          for script in tests/e2e/*.sh; do "$script"; done
      - name: Build cross-platform binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=${TAG#v}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            output="dist/flowctl-$GOOS-$GOARCH"
            if [ "$GOOS" = "windows" ]; then output="$output.exe"; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.packVersion=$VERSION" -o "$output" ./cmd/flowctl
          done
      - name: Package Skill distribution
        run: |
          set -eu
          mkdir -p package/coding-skills/dist
          cp -R skills adapters schemas install docs spec package/coding-skills/
          cp README.md go.mod go.sum package/coding-skills/
          cp dist/flowctl-* package/coding-skills/dist/
          tar -czf dist/coding-skills.tar.gz -C package coding-skills
          (cd package && zip -qr ../dist/coding-skills.zip coding-skills)
          (cd dist && sha256sum flowctl-* coding-skills.tar.gz coding-skills.zip > checksums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
