schema_version: 1

states:
  - intake
  - baselining
  - document_audit
  - workspace_audit
  - workspace_cleanup_planning
  - workspace_cleaning
  - engineering_profiling
  - goal_alignment
  - planning
  - researching
  - test_specification
  - implementing
  - verifying
  - reviewing
  - integrating
  - releasing
  - syncing
  - completed
  - blocked
  - failed
  - cancelled

entry_routes:
  status_query:
    sequence:
      - orchestrate-ai-delivery
      - flowctl_status
    mutates_project: false
  greenfield_goal:
    sequence:
      - initialize-ai-project
      - discover-product-goal
      - plan-product-delivery
      - profile-project-engineering
  existing_project_goal:
    sequence:
      - initialize-ai-project
      - adopt-existing-project
      - profile-project-engineering
      - discover-product-goal
      - plan-product-delivery
  workspace_cleanup:
    sequence:
      - orchestrate-ai-delivery
      - clean-project-workspace
      - sync-project-knowledge
    requires_initialized_project: true
    requires_explicit_user_request: true
  bug_fix:
    sequence:
      - orchestrate-ai-delivery
      - profile-project-engineering
      - specify-tests
      - diagnose-and-verify
      - review-change
      - integrate-git-change
      - manage-release
      - sync-project-knowledge
  feature_delivery:
    sequence:
      - orchestrate-ai-delivery
      - discover-product-goal
      - plan-product-delivery
      - profile-project-engineering
      - research-and-design-solution
      - specify-tests
      - implement-work-item
      - diagnose-and-verify
      - review-change
      - integrate-git-change
      - manage-release
      - sync-project-knowledge

solution_confirmation:
  backend_or_architecture:
    requires:
      - viable_option_comparison
      - strengths_and_weaknesses
      - project_fit_and_migration_impact
      - recommendation_with_reason
      - user_confirmation_for_material_choice
  frontend_ux_ui:
    requires:
      - two_or_three_distinct_html_directions_when_uncertain
      - responsive_and_interactive_preview
      - recommendation_with_reason
      - user_confirmation_before_production_implementation
  prototypes_are_production_code: false

required_traceability:
  - goal_to_requirement
  - requirement_to_work_item
  - requirement_to_test
  - work_item_to_commit
  - commit_to_evidence
  - evidence_to_release

release_gates:
  - schema_valid
  - traceability_complete
  - required_tests_verified
  - engineering_profile_current
  - material_solution_choices_confirmed
  - workspace_document_inventory_valid_when_present
  - workspace_structure_inventory_valid_when_present
  - workspace_cleanup_plan_valid_when_present
  - required_visual_evidence_verified
  - blocking_review_findings_resolved
  - git_revision_matches_evidence
  - active_documents_not_superseded
  - board_rendered_from_current_state
  - board_versions_tasks_decisions_tests_traceable

harness:
  states:
    - ready
    - running
    - checkpointed
    - verifying
    - reviewing
    - completed
    - blocked
    - failed
    - cancelled
  checkpoint_before:
    - context_compaction
    - external_wait
    - user_pause
    - retry
    - phase_transition
  required_budgets:
    - elapsed_time
    - retries
    - change_scope
  optional_budgets:
    - tokens
    - cost

user_communication:
  language: match_user
  lead_with:
    - outcome
    - impact
    - current_progress
    - next_action
  hide_by_default:
    - skill_names
    - object_ids
    - enum_values
    - workflow_abbreviations
    - revisions_and_hashes
    - machine_directories
  technical_detail: on_request_or_when_actionable
  approval_choices: natural_language

conversation_continuity:
  reenter_from_repository_state_each_turn: true
  interruption_types:
    - status_or_explanation
    - in_scope_clarification
    - material_requirement_change
    - independent_request
    - replacement_or_cancellation
    - unrelated_side_question
    - resume_or_ide_switch
  save_progress_before:
    - material_scope_change
    - replacement
    - cancellation
    - user_pause
    - ide_handoff
  unrelated_message_is_approval: false
  continue_message_is_approval: false
  invalidate_only_affected_downstream_records: true
  regenerate_board_after_state_change: true
