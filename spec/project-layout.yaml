schema_version: 1

roots:
  machine: .ai-flow
  human: docs/board
  canonical_installed_skills: .agents/skills
  cursor_skills: .cursor/skills
  claude_skills: .claude/skills

machine_files:
  manifest: .ai-flow/manifest.yaml
  skill_lock: .ai-flow/skill-pack.lock.yaml
  project_config: .ai-flow/project.yaml
  capabilities: .ai-flow/capabilities.yaml
  current_state: .ai-flow/state/current.yaml
  engineering_profile: .ai-flow/baseline/engineering-profile.json
  workspace_document_inventory: .ai-flow/baseline/workspace-document-inventory.json
  workspace_structure_inventory: .ai-flow/baseline/workspace-structure-inventory.json
  active_explorations: .ai-flow/prototypes

machine_directories:
  append_only:
    - .ai-flow/events
    - .ai-flow/evidence
  versioned_objects:
    - .ai-flow/baseline
    - .ai-flow/goals
    - .ai-flow/requirements
    - .ai-flow/plans
    - .ai-flow/work-items
    - .ai-flow/decisions
    - .ai-flow/tests
    - .ai-flow/runs
    - .ai-flow/reports
    - .ai-flow/releases
    - .ai-flow/workspace-cleanup
  working_artifacts:
    - .ai-flow/prototypes
  coordination:
    - .ai-flow/locks
  historical:
    - .ai-flow/archive
    - .ai-flow/archive/legacy-documents
    - .ai-flow/archive/legacy-code
    - .ai-flow/archive/legacy-files
    - .ai-flow/archive/design-explorations

human_files:
  - docs/board/STATUS.md
  - docs/board/ROADMAP.md
  - docs/board/CURRENT_STATE.md
  - docs/board/RELEASES.md

platform_entries:
  cursor:
    - .cursor/rules/ai-flow.mdc
    - .cursor/skills
  codex:
    - AGENTS.md
  claude_code:
    - CLAUDE.md
    - .claude/skills/ai-flow/SKILL.md
    - .claude/skills

rules:
  machine_state_is_source_of_truth: true
  human_board_is_generated: true
  human_board_leads_with_natural_language: true
  human_board_groups_work_by_major_and_minor_version: true
  human_board_shows_decisions_and_test_evidence: true
  user_facing_language_is_natural_and_product_oriented: true
  internal_workflow_vocabulary_is_not_primary_user_output: true
  user_choices_use_plain_language_and_are_mapped_internally: true
  technical_ids_and_paths_are_secondary_on_request: true
  arbitrary_workflow_docs_forbidden: true
  archived_objects_excluded_from_active_context: true
  generated_platform_entries_must_preserve_user_content: true
  legacy_document_moves_require_path_level_approval: true
  legacy_document_archives_preserve_original_paths_and_hashes: true
  initialization_non_document_candidates_are_mark_only: true
  workspace_cleanup_requires_explicit_post_initialization_request: true
  workspace_cleanup_requires_path_level_approval: true
  workspace_cleanup_is_component_and_language_aware: true
  material_technical_choices_require_user_confirmation: true
  uncertain_frontend_directions_use_isolated_html_explorations: true
  ux_prototypes_are_not_production_code: true
