schema_version: 1
pack:
  name: mxm-ai-flow
  version: 0.2.3
  canonical_skill_root: skills
  target_skill_roots:
    codex: .agents/skills
    cursor: .cursor/skills
    claude_code: .claude/skills
  machine_state_root: .ai-flow
  human_board_root: docs/board

compatibility:
  standard: agent-skills
  required_frontmatter:
    - name
    - description
  forbidden_core_dependencies:
    - vendor_specific_frontmatter
    - vendor_specific_tool_names
    - mandatory_mcp
    - mandatory_subagents
    - mandatory_hooks

installation:
  platform_flags:
    cursor: --cursor
    codex: --codex
    claude_code: --claude
    all: --all
  flags_are_composable: true
  install_default: all
  update_default: installed_platforms
  platform_state_file: .ai-flow/install/platforms

profiles:
  core:
    required: true
    skills:
      - initialize-ai-project
      - orchestrate-ai-delivery
      - adopt-existing-project
      - discover-product-goal
      - plan-product-delivery
      - profile-project-engineering
      - research-and-design-solution
      - specify-tests
      - implement-work-item
      - diagnose-and-verify
      - review-change
      - integrate-git-change
      - manage-release
      - sync-project-knowledge
  team:
    extends: core
    skills: []
    enables:
      - multi_agent_leases
      - worktrees
      - approval_matrix
      - protected_path_owners
  secure:
    extends: team
    skills:
      - assess-security-and-supply-chain
  delivery:
    extends: secure
    skills:
      - deploy-release
      - observe-and-recover

platform_entries:
  cursor:
    discovery_roots:
      - .cursor/skills
      - .agents/skills
    persistent_route: .cursor/rules/ai-flow.mdc
  codex:
    discovery_root: .agents/skills
    persistent_route: AGENTS.md
  claude_code:
    discovery_root: .claude/skills
    entry_skill: ai-flow
    delegates_to: .claude/skills/orchestrate-ai-delivery/SKILL.md
    persistent_route: CLAUDE.md
